<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Market Place</h1>
      <nav>
        <a href="#produk">Produk</a>
        <a href="#kontak">Kontak</a>
        <a href="#" class="cart-link"
          >Keranjang (<span id="cart-cont">0</span>)</a
        >
      </nav>
    </header>
    <main id="produk">
      <div class="product-grid">
        <div class="product-card">
          <img src="gambar/laptop.jpg" alt="Laptop Gaming" />
          <h3>Laptop Gaming</h3>
          <p class="price">Rp-14.550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Laptop Gaming"
            data-harga="14550000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="gambar/OIP.webp" alt="Mouse Gaming" />
          <h3>Mouse Gaming</h3>
          <p class="price">Rp-550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="Mouse Gaming" data-harga="550000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="gambar/mouse pad.webp" alt="Mouse Pad Gaming" />
          <h3>Mouse Pad Gaming</h3>
          <p class="price">Rp-350.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Mouse Pad Gaming"
            data-harga="350000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="gambar/meja.webp" alt="Meja Gaming" />
          <h3>Meja Gaming</h3>
          <p class="price">Rp-2.500.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="Meja Gaming" data-harga="2500000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="gambar/kyeboard.webp" alt="Keyboard Gaming" />
          <h3>Keyboard Gaming</h3>
          <p class="price">Rp-1.550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Keyboard Gaming"
            data-harga="1550000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="gambar/laptop.jpg" alt="Laptop Gaming" />
          <h3>Laptop Gaming</h3>
          <p class="price">Rp-14.550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="Laptop Gaming"
            data-harga="14550000"
          >
            Beli Sekarang
          </button>
        </div>
      </div>
    </main>
    <footer id="kontak">
      <h3>Hubungi Kami</h3>
      <form class="contact-form">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Nama lengkap" />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email aktif" />

        <label for="pesan">Pesan:</label>
        <textarea id="pesan" placeholder="Tulis pesan..."></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
      <p>copyright 2026 by nama kalian</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
